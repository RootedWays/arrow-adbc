[package]
name = "gateway-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework & Runtime
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI Argument Parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Arrow & ADBC
# Using the same relative paths as the existing 'core' crate in this repo
adbc_core = { path = "../../rust/core" }
adbc_driver_manager = { path = "../../rust/driver_manager" }
arrow = { version = "57.1.0", features = ["ipc"] } # Match version from core/Cargo.toml if possible, but 53.1.0 is safe